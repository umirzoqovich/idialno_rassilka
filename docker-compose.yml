version: '3.8'

services:
  telegram-rassilka:
    build: .
    container_name: tg_rassilka
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./session:/app/session
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    environment:
      - HOST=0.0.0.0
      - PORT=5000
